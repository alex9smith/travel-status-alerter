name: Travel status alert

on:
  schedule:
    # GitHub cron is UTC-only. Fire at both 06:17 and 07:17 UTC, Monday to Thursday; the
    # script's UK-hour guard lets exactly one through, giving ~07:17 UK time in GMT and BST.
    # Deliberately offset from the top of the hour: GitHub Actions documents that
    # on-the-hour schedules are the most congested slot and can be delayed by hours under
    # load, which previously pushed runs so late they missed the guard's 07:00 UK window
    # entirely (see e.g. runs that actually fired at 11:54 and 13:21 UTC instead).
    - cron: "17 6 * * 1-4"
    - cron: "17 7 * * 1-4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check TfL status and alert on Telegram
        run: uv run --frozen --no-dev travel-status-alerter
        env:
          TFL_API_KEY: ${{ secrets.TFL_API_KEY }}
          TFL_LINES: ${{ secrets.TFL_LINES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
